  <rect x="432" y="105" width="256" height="320" class="room" fill="#e5ddf1"/>
  <rect x="92" y="425" width="400.90" height="239.46" class="room" fill="#efe8d5"/>
  <rect x="492.90" y="425" width="195.10" height="239.46" class="room" fill="#e4edfa"/>
  <rect x="432" y="426" width="59" height="79" fill="url(#tile)" stroke="#bb9352" stroke-dasharray="4 3"/>
  <rect x="92" y="504.46" width="104" height="160" class="room" fill="#f4e4d3"/>
  <rect x="196" y="520.46" width="136" height="144" class="room" fill="#d9eced"/>
  <rect x="332" y="557.80" width="72" height="106.66" class="room" fill="#d9eced"/>
  <line x1="207" y1="105" x2="306" y2="105" class="window"/>
  <line x1="494" y1="105" x2="593" y2="105" class="window"/>
  <line x1="688" y1="486" x2="688" y2="550" class="window"/>
  <line x1="305" y1="425" x2="409" y2="425" class="door"/>
  <line x1="435" y1="425" x2="489" y2="425" class="door"/>
  <line x1="492.90" y1="514" x2="492.90" y2="578" class="door"/>
  <line x1="113" y1="504.46" x2="173" y2="504.46" class="door"/>
  <line x1="236" y1="520.46" x2="296" y2="520.46" class="door"/>
  <line x1="343" y1="557.80" x2="393" y2="557.80" class="door"/>
  <line x1="420" y1="664.46" x2="480" y2="664.46" class="door"/>
  <text x="262" y="263" class="label">Living room</text><text x="262" y="286" class="area">17.0 m² assumed</text>
  <text x="560" y="263" class="label">Bedroom</text><text x="560" y="286" class="area">12.8 m² assumed</text>
  <text x="590" y="542" class="label">Kitchen</text><text x="590" y="565" class="area">7.3 m² listed</text>
  <text x="279" y="471" class="label">Hall</text><text x="279" y="491" class="area">8.14 m² assumed</text>
  <text x="144" y="578" class="minor">Wardrobe</text><text x="144" y="596" class="area">2.6 m²</text>
  <text x="264" y="584" class="minor">Bath</text><text x="264" y="602" class="area">3.06 m²</text>
  <text x="368" y="611" class="minor">WC</text><text x="368" y="628" class="area">1.2 m²</text>
