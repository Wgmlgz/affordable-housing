<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 810" role="img" aria-labelledby="title desc">
  <title id="title">Candidate B: bedroom connects to a tiled corridor spur</title>
  <desc id="desc">Alternative schematic with the same listing areas. A small unseen tile-floored hall section explains the patterned floor beyond the bedroom door.</desc>
  <style>
    text {font-family:Arial, sans-serif;fill:#202b33} .title{font-size:25px;font-weight:bold}.sub{font-size:13px;fill:#52616b}.room{stroke:#36434b;stroke-width:2;stroke-dasharray:7 4}.label{font-size:17px;font-weight:bold;text-anchor:middle}.area{font-size:13px;text-anchor:middle;fill:#42535d}.minor{font-size:12px;font-weight:bold;text-anchor:middle}.door{stroke:#f08225;stroke-width:8;stroke-linecap:round}.window{stroke:#228cca;stroke-width:9;stroke-linecap:round}.hint{font-size:13px;fill:#9a4b0c}
  </style>
  <defs><pattern id="tile" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#faf4dd"/><path d="M0 0L16 16M16 0L0 16" stroke="#ab9977" stroke-width="1"/></pattern></defs>
  <rect width="850" height="810" fill="#f7f8f7"/>
  <text x="48" y="45" class="title">Candidate B · bedroom → hall</text>
  <text x="48" y="70" class="sub">Alternative: unphotographed tiled spur beside the bedroom</text>
